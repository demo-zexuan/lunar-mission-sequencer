.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}

@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

</div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>受力的那一级：正在点火时尾焰从它的喷口喷出</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>导轨即任务剖面：滑架位置就是任务进度</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>九面事件旗，走到一个升起一个</span><span class="iso-key"><svg class="iso-swatch" data-mark="dotted" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>表针每相位转一圈，任务钟走真实 MET</span></span><span class="iso-caption">阿波罗 11 号的任务剖面被弯成了一根导轨：T+0 从发射台升起，T+2:44:16 地月转移注入，T+75:49:50 进入环月轨道，T+102:45:40 着陆，T+135:23:42 返回点火，T+195:18:35 溅落。整程 8 天 3 小时 18 分 35 秒，往返 384,400 km。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];

    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}

/**
 * 月球任务时序仪 · 真实数据模型
 *
 * 本模块是整个图形唯一的"真值"来源：任务时序、相位划分、
 * 轨道高度与速度、发动机构型，以及导轨中心线的几何。
 * 图形里的每一个数字（读数、表针、计数窗、旗帜、滑架位置）
 * 都必须从这里的同一个瞬间取值，不允许各自插值。
 *
 * I. 任务时序
 *
 * 1. 事件表（EVENTS）：阿波罗 11 号 9 个关键事件，MET 为真实秒数
 *    (1) 每个事件同时携带导轨进度 p，p 决定几何位置
 *    (2) p 的分配同时决定巡游时各相位的显示时长
 * 2. 相位表（PHASES）：事件之间的 8 段区间，读数与表盘按它分区
 *
 * II. 物理量
 *
 * 1. 高度/距离/速度按相位线性插值，端点取真实数值
 * 2. 发动机构型（burn）决定 WebGL 尾焰挂在哪一级、推力多大
 * 3. 构型（stack）决定箭体哪几段还在：分离后逐段消失
 *
 * III. 导轨几何
 *
 * 1. 导轨中心线是一条平面曲线（y 恒为 0），由 PROFILE 控制点
 *    以 p 为参数的 Catmull-Rom 样条生成
 * 2. 滑架挂在 y = +14 的竖直平面内，因此导轨可以从背后支撑
 * 3. 采样后的折线同时供三处使用：绘制、审计形状、页面运动学
 *
 * @module src/model
 * @author zexuan.peng <pengzexuan2001@gmail.com>
 * @created 2026-10-12
 */

// ============================================================================
// I. 任务时序

/** 1. 事件表：MET 单位秒，p 为导轨进度（0 = 发射台，1 = 溅落） */
const EVENTS = [

  { code: "SIC-SEP", zh: "一级分离", en: "S-IC staging", met: 162, p: 0.055 },
  { code: "ORBIT", zh: "停泊轨道", en: "Parking orbit", met: 709, p: 0.115 },
  { code: "TLI", zh: "地月转移注入", en: "Trans-lunar injection", met: 9856, p: 0.2 },
  { code: "LOI", zh: "环月轨道进入", en: "Lunar orbit insertion", met: 272990, p: 0.55 },
  { code: "TOUCHDOWN", zh: "月面着陆", en: "Lunar touchdown", met: 369940, p: 0.7 },

];

/** 八个相位各自的名称：相位描述的是这一段时间里在做什么，不是事件名 */
const PHASE_NAMES = [
  ["上升飞行", "Ascent"],
  ["入轨", "Orbit insertion"],
  ["停泊轨道", "Parking orbit"],
  ["地月转移", "Trans-lunar coast"],

  ["返回与再入", "Return and reentry"],
];

/** 2. 相位表：第 i 段 = EVENTS[i] → EVENTS[i+1]，共 8 段 */
const PHASES = EVENTS.slice(0, -1).map((from, index) => {
  const to = EVENTS[index + 1];
  return {
    index,
    code: `${from.code}→${to.code}`,
    zh: PHASE_NAMES[index][0],
    en: PHASE_NAMES[index][1],
    from: from.met,
    to: to.met,
    pFrom: from.p,
    pTo: to.p,
  };
});

/** 任务总时长（秒），用于读数与文档 */
const TOTAL_MET = EVENTS[EVENTS.length - 1].met;

/** 真实参考量（说明书、卡片说明与图注引用） */
const FACTS = {
  distanceKm: 384400,
  saturnVHeightM: 110.6,
  saturnVLiftoffMassT: 2970,
  tliDeltaVKmS: 3.05,
  entrySpeedKmS: 11.0,
  lmMassT: 15.1,
  earthRadiusKm: 6371,
  moonRadiusKm: 1737,
  parkingOrbitKm: 185,
  periluneKm: 111,
};

// ============================================================================
// II. 物理量
// ============================================================================

const lerp = (a, b, f) => a + (b - a) * f;
const clamp01 = (f) => Math.min(1, Math.max(0, f));

/**
 * 每个相位的端点物理量：[高度 km, 距离地心 km, 速度 km/s]
 *
 * 1. 高度是相对当前主天体（地球相位相对地球，月球相位相对月面）
 * 2. 距离地心用于读数；月球段取近似的月球距离
 * 3. 速度为惯性速度，TLI 后 10.83 → 0.98，再入 11.0 → 0
 */
const ENDPOINTS = [
  // 0 发射：0 → 一级分离
  { alt: [0, 67], range: [6371, 6438], speed: [0, 2.76] },
  // 1 一级分离 → 入轨
  { alt: [67, 185], range: [6438, 6556], speed: [2.76, 7.79] },
  // 2 停泊轨道
  { alt: [185, 185], range: [6556, 6556], speed: [7.79, 7.79] },
  // 3 TLI → 环月：距离地心 6556 → 384400 - 1737
  { alt: [185, 111], range: [6556, 382663], speed: [7.79, 0.98] },
  // 4 LOI → 着陆：月面高度 111 → 0
  { alt: [111, 0], range: [384400, 384400], speed: [1.63, 0] },
  // 5 着陆 → 上升对接
  { alt: [0, 111], range: [384400, 384400], speed: [0, 1.63] },
  // 6 对接 → 返回点火
  { alt: [111, 111], range: [384400, 384400], speed: [1.63, 1.63] },
  // 7 返回 → 溅落：距离地心 384400 → 6371
  { alt: [111, 0], range: [384400, 6371], speed: [1.63, 0] },
];

/**
 * 相位内分数
 *
 * @param p - 导轨进度 0..1
 * @returns {{ index: number, f: number, met: number }}
 */
function phaseAt(p) {
  const at = clamp01(p);
  // 找到 p 落在哪一段事件区间
  let index = PHASES.length - 1;
  for (let i = 0; i < PHASES.length; i++) {
    if (at >= PHASES[i].pFrom && at <= PHASES[i].pTo) {
      index = i;
      break;
    }
  }
  const ph = PHASES[index];
  const span = ph.pTo - ph.pFrom;
  const f = span > 1e-9 ? clamp01((at - ph.pFrom) / span) : 0;
  return { index, f, met: lerp(ph.from, ph.to, f) };
}

/** 相位内的物理量，读数与图注都从这里取 */
function physicsAt(p) {
  const { index, f, met } = phaseAt(p);
  const e = ENDPOINTS[index];
  return {
    index,
    f,
    met,
    altKm: lerp(e.alt[0], e.alt[1], f),
    rangeKm: lerp(e.range[0], e.range[1], f),
    speedKmS: lerp(e.speed[0], e.speed[1], f),
    onMoon: index === 4 || index === 5,
  };
}

/**
 * 发动机构型
 *
 * I. 返回当前正在工作的发动机与推力水平（0..1）
 *
 * 1. 各次点火都用真实的持续时长换算成相位内分数
 *    (1) S-IC 与 S-II 覆盖整个上升段
 *    (2) TLI 点火 5 分 47 秒，落在相位 3 的最前段
 *    (3) 两次 LOI 点火、动力下降、上升级、SPS 返回点火
 * 2. 推力水平用于尾焰长度与亮度，不参与任何数字读数
 */
function burnAt(p) {
  const { index, f } = phaseAt(p);
  const thrust = (level) => ({ engine: level > 0 ? "on" : "off", level });
  if (index === 0) return { engine: "s1c", level: 1 };
  if (index === 1) return { engine: f < 0.55 ? "s2" : "s4b", level: 1 };
  if (index === 2) return thrust(0);
  if (index === 3) return f < 0.012 ? { engine: "s4b", level: 1 } : thrust(0);
  if (index === 4) {
    // 两次环月制动 + 动力下降（相位末段 12 分钟）
    if (f < 0.03 || (f > 0.1 && f < 0.14)) return { engine: "sps", level: 0.85 };
    if (f > 0.96) return { engine: "lmd", level: 0.6 };
    return thrust(0);
  }
  if (index === 5) {
    if (f < 0.06) return thrust(0); // 月面停留
    if (f < 0.12) return { engine: "lma", level: 0.7 };
    return thrust(0);
  }
  if (index === 6) return f > 0.55 && f < 0.72 ? { engine: "sps", level: 0.8 } : thrust(0);
  return thrust(0);
}

/**
 * 箭体构型
 *
 * I. 返回此刻还挂在滑架上的舱段
 *
 * 1. 分离时刻取真实 MET：逃逸塔 T+3:17、一级 T+2:42、
 *    二级 T+9:30、三级（TLI 后）T+2:50、登月舱对接后抛弃、
 *    服务舱再入前抛弃
 * 2. 布尔值直接驱动页面上的 display 切换
 */
function stackAt(p) {
  const met = phaseAt(p).met;
  return {
    les: met < 197,
    s1c: met < 162,
    s2: met < 570,
    s4b: met < 10256,
    lm: met < 490000,
    sm: met < 700000,
  };
}

/**
 * 级间分离
 *
 * I. 每一级都在真实时刻脱离，并且**看得见地离开**
 *
 * 1. 分离不是瞬间消失：从 met 起用 JETTISON_SPAN 的时长把该级推离箭体
 *    (1) 推离方向取"向后下方"，与飞行方向相反，符合真实的分离相对运动
 *    (2) 同时淡出，最终从绘制里移除，但分离过程本身是可见的
 * 2. 逃逸塔是例外：它在 T+3:17 向前上方抛掉（逃逸塔分离是拉走，不是掉落）
 * 3. 服务舱在再入前抛掉，溅落的只有指令舱
 */

/** 分离动画占全程的比例：真实 8 天压进 17 秒巡游，这里给足约 0.5 秒的可见过程 */
const JETTISON_SPAN = 0.028;

/**
 * 由 MET 反查导轨进度
 *
 * 时间轴是分段线性的（前 12 小时占了导轨的一半），所以 MET 上的跨度
 * 不能直接当成 p 上的跨度：分离动画必须在 p 上量，否则一级分离要
 * 花掉三个小时的真实任务时间才走完。
 */
function pAtMet(met) {
  for (const ph of PHASES) {
    if (met >= ph.from && met <= ph.to) {
      const span = ph.to - ph.from;
      return span > 1e-9 ? ph.pFrom + (ph.pTo - ph.pFrom) * ((met - ph.from) / span) : ph.pFrom;
    }
  }
  return met <= 0 ? 0 : 1;
}

/** 分离顺序与方向：dir 是 (x, y, z) 上的相对推离方向 */
const JETTISON = [
  { id: "sic", met: 162, zh: "一级分离", dir: [-1, 0, -1] },
  { id: "les", met: 197, zh: "逃逸塔分离", dir: [1, 0, 1] },
  { id: "s2", met: 571, zh: "二级分离", dir: [-1, 0, -1] },
  { id: "s4b", met: 10256, zh: "三级分离", dir: [-1, 0, -1] },
  // 服务舱真实分离在 T+194:49，落在导轨最后 0.1% 上，按 MET 换算根本看不见；
  // 这里改用它所在的再入界面 p 值，事件本身不变
  { id: "sm", p: 0.962, met: 700000, zh: "服务舱分离", dir: [1, 0, -1] },
];

/** 分离行程（世界单位）：够远到读得出"掉下去了"，又不至于飞出画面 */
const JETTISON_TRAVEL = 54;

/**
 * 每级的分离进度
 *
 * @param p - 导轨进度 0..1
 * @returns {Record<string, number>} 0 = 仍连着，1 = 已完全脱离
 */
function jettisonAt(p) {
  const out = {};
  for (const event of JETTISON) out[event.id] = clamp01((p - (event.p ?? pAtMet(event.met))) / JETTISON_SPAN);
  return out;
}

/**
 * 登月舱吊放行程
 *
 * I. 滑架在月面上方停住，卷扬机把登月舱单独放下再收回
 *
 * 1. 下降：p 0.655 → 0.700，行程 0 → 1
 * 2. 月面停留：p 0.700 → 0.735，保持 1
 * 3. 上升与对接：p 0.735 → 0.780，行程 1 → 0
 * 4. 行程换算成世界单位由 geometry 决定（HOIST_TRAVEL）
 */
function hoistAt(p) {
  const at = clamp01(p);
  if (at <= 0.655) return 0;
  if (at < 0.7) return clamp01((at - 0.655) / 0.045);
  if (at <= 0.735) return 1;
  if (at < 0.78) return 1 - clamp01((at - 0.735) / 0.045);
  return 0;
}

/** MET → "T+102:45:40" */
function metLabel(met) {
  const s = Math.max(0, Math.round(met));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return `T+${pad(h)}:${pad(m)}:${pad(sec)}`;
}

/** 数字分组，读数用 */
function group(value, digits = 0) {
  const fixed = value.toFixed(digits);
  const [whole, frac] = fixed.split(".");
  const spaced = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return frac ? `${spaced}.${frac}` : spaced;
}

// ============================================================================
// III. 导轨几何
// ============================================================================

/**
 * 导轨中心线控制点 [x, y, z, p]
 *
 * I. 曲线即任务剖面：左端发射台起，陡升、平飞、落到月球上方，
 *    再沿一条更低的返回弧折回左端，最后陡降入水
 *
 * 1. 高度由悬挂几何反推
 *    (1) 发射台：箭体底部 z = 8（台面），全箭挂长 74 → 导轨 z = 82
 *    (2) 月面：登月舱底部落在月面 z = 113，吊放行程 26 → 导轨 z = 185
 *    (3) 溅落：指令舱底部落到水面 z = 24，只剩逃逸塔以下 → 导轨 z = 56
 * 2. 去程弧与回程弧在竖直方向拉开约 25 单位，避免屏幕上重叠
 * 3. 月面停靠点 p 0.700 → 0.780 几乎不动，由卷扬机完成下降与上升
 */
const PROFILE = [
  [-125, 0, 90, 0.0],
  [-122, 0, 100, 0.03],
  [-116, 0, 112, 0.055],
  [-106, 0, 124, 0.09],
  [-94, 0, 131, 0.115],
  [-72, 0, 136, 0.15],
  [-26, 0, 139, 0.2],
  [28, 0, 140, 0.35],
  [72, 0, 139, 0.45],
  [98, 0, 138, 0.55],
  [122, 0, 138, 0.62],
  [142, 0, 139, 0.7],
  [140, 0, 139, 0.78],
  [20, 0, 116, 0.86],
  [-40, 0, 111, 0.9],
  [-90, 0, 103, 0.93],
  [-118, 0, 92, 0.955],
  [-136, 0, 74, 0.975],
  [-146, 0, 60, 0.99],
  [-150, 0, 52, 1.0],
];

/**
 * 以 p 为参数的 Catmull-Rom 样条（非均匀、端点夹持）
 *
 * I. 三次 Hermite 形式，节点处严格过控制点
 *
 * 1. 切向量取相邻控制点的差商，端点用单侧差商
 * 2. 平顶（月面停靠）处切向量自然趋零，不会产生过冲
 */
function splineAt(p) {
  const at = clamp01(p);
  const n = PROFILE.length;
  let i = n - 2;
  for (let j = 0; j < n - 1; j++) {
    if (at >= PROFILE[j][3] && at <= PROFILE[j + 1][3]) {
      i = j;
      break;
    }
  }
  const a = PROFILE[i];
  const b = PROFILE[i + 1];
  const prev = PROFILE[Math.max(0, i - 1)];
  const next = PROFILE[Math.min(n - 1, i + 2)];
  const span = b[3] - a[3] || 1;
  const t = (at - a[3]) / span;
  const t2 = t * t;
  const t3 = t2 * t;
  const out = [];
  for (let axis = 0; axis < 3; axis++) {
    const m0 = ((b[axis] - prev[axis]) / (b[3] - prev[3] || 1)) * span;
    const m1 = ((next[axis] - a[axis]) / (next[3] - a[3] || 1)) * span;
    const h00 = 2 * t3 - 3 * t2 + 1;
    const h10 = t3 - 2 * t2 + t;
    const h01 = -2 * t3 + 3 * t2;
    const h11 = t3 - t2;
    out.push(h00 * a[axis] + h10 * m0 + h01 * b[axis] + h11 * m1);
  }
  return out;
}

/**
 * 采样导轨折线
 *
 * I. 生成页面与几何共用的中心线
 *
 * 1. 等 p 采样 480 段，同时累计弧长
 * 2. 返回 { points, lengths, total }，points 为 [x, y, z, p]
 * 3. 页面用它在任意 p 上取位置与切向，几何用它画轨与录形状
 */
function railPath(steps = 480) {
  const points = [];
  const lengths = [0];
  let total = 0;
  let previous = null;
  for (let i = 0; i <= steps; i++) {
    const p = i / steps;
    const [x, y, z] = splineAt(p);
    if (previous) total += Math.hypot(x - previous[0], y - previous[1], z - previous[2]);
    points.push([x, y, z, p]);
    lengths.push(total);
    previous = [x, y, z];
  }
  return { points, lengths: lengths.slice(1), total };
}

/** 导轨上任意 p 处的世界位置 */
function railPoint(p) {
  const [x, y, z] = splineAt(p);
  return [x, y, z];
}

/** 导轨上任意 p 处的单位切向（用于滑架俯仰） */
function railTangent(p) {
  const d = 1e-4;
  const a = splineAt(clamp01(p - d));
  const b = splineAt(clamp01(p + d));
  const v = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const len = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / len, v[1] / len, v[2] / len];
}

/**
 * 月球任务时序仪 · 页面运行时
 *
 * I. 一份状态，四处输出
 *
 * 1. 唯一的状态是任务进度 p（0 = 发射台，1 = 溅落）
 *    (1) 巡游按真实事件节奏推进，交互时指数跟随
 *    (2) window.__lunar.set(p, { settle: true }) 用于逐帧录制 GIF
 * 2. 每一帧从同一个 p 取值：滑架位置、卷扬机行程、构型、
 *    表针、任务钟数字、旗帜、读数、WebGL 尾焰
 *
 * II. 深度重排
 *
 * 1. 运动项带 data-move="rail"，其深度随导轨局部深度变化
 * 2. 每帧算 key = data-k + (depth(railPoint(p)) − depth(restRail))，
 *    只有次序真的变了才重新挂 DOM
 *
 * III. 交互
 *
 * 1. 指针横向拖动 = 扫过整个任务；方向键按事件步进；空格播放/暂停
 * 2. 无人操作 1.4 秒后回到巡游；离开视口、降级动效都停
 *
 * @module src/live
 * @author zexuan.peng <pengzexuan2001@gmail.com>

// ============================================================================
// I. 状态与巡游
// ============================================================================

const TOUR_SECONDS = 17;
const HOLD_SECONDS = 1.6;
const RESET_SECONDS = 5.5;

let p = D.rest.p;
let target = p;
let clock = 0;
let touring = !still.matches;
let visible = false;

let last = 0;
let quiet = 0;
let phase = "tour";

/** 巡游：正程按事件进度走完，停一下，再复位回发射台 */
function tourAt(t) {
  if (t < TOUR_SECONDS) return t / TOUR_SECONDS;
  if (t < TOUR_SECONDS + HOLD_SECONDS) return 1;
  const back = (t - TOUR_SECONDS - HOLD_SECONDS) / RESET_SECONDS;
  return back >= 1 ? 0 : 1 - back;
}

/**
 * 级间分离
 *
 * I. 分离是"看得见地离开"，而且是**一定会走完**的过程
 *
 * 1. jettisonAt(p) 给出目标进度；真正画出来的 sepState 用时间追上去
 *    (1) 只往前追、不后退：拖到窗口中间松手，分离仍会自己走完，
 *        不会把某一级永远定格在半分离上（这正是之前"一级一直存在"的原因）
 *    (2) 倒带时直接跟随目标值，于是往回拖能立刻恢复成完整的箭
 * 2. 位移沿分离方向推离，再绕该级自身中心轻微翻转，最后淡出
 */
const SEP_SECONDS = 0.5;
const sepState = new Map();

function applyStack(progress, dt = 0, snap = false) {
  const jettison = jettisonAt(progress);
  for (const [id, group] of stageGroups) {
    const want = jettison[id] ?? 0;
    const held = sepState.get(id) ?? 0;
    // 录制取该 p 的静态姿态；倒带到事件之前立刻恢复完整箭；
    // 否则一旦踏进分离窗口就一路推到底——停在窗口中间不会留下半分离的箭
    const k = snap ? want : want <= 0 ? 0 : Math.min(1, Math.max(held, want) + dt / SEP_SECONDS);
    sepState.set(id, k);
    if (k <= 0) {
      if (group.style.display === "none") group.style.display = "";
      if (group.dataset.sep) {
        group.removeAttribute("transform");
        group.style.opacity = "";
        delete group.dataset.sep;
      }
      continue;
    }
    if (k >= 1) {
      if (group.style.display !== "none") group.style.display = "none";
      continue;
    }
    const event = JETTISON.find((entry) => entry.id === id);
    const dir = event ? event.dir : [-1, 0, -1];
    const travel = k * JETTISON_TRAVEL;
    // 分离体的位移与自转都在箭体自身的局部坐标系里：先推离，再绕自身中心轻微翻转

    group.dataset.sep = "1";
  }
}

const RAISED = 3.6;

function draw(dt = 0, snap = false) {
  const rail = railPoint(p);
  const dx = rail[0] - restRail[0];
  const dz = rail[2] - restRail[2];
  const move = translateAlong(P, [dx, 0, dz]);
  for (const item of moving) item.node.setAttribute("transform", move);

  const info = physicsAt(p);
  const hoist = hoistAt(p) * D.hoist;
  if (lmGroup) lmGroup.setAttribute("transform", translateAlong(P, [0, 0, -hoist]));
  applyStack(p, dt, snap);
  syncBar(p);

  // 表针：每个相位扫过一格（整盘八格）
  const sweep = (info.index + info.f) / 8;
  const angle = sweep * Math.PI * 2;
  const dial = D.dial;
  needle.setAttribute(
    "d",
    lineOnTop(
      [dial.x - Math.sin(angle) * 2.0, dial.y + Math.cos(angle) * 2.0],
      [dial.x + Math.sin(angle) * (dial.r - 5), dial.y - Math.cos(angle) * (dial.r - 5)],
      dial.top + 0.25,
      P,
    ),
  );

  // 任务钟：机器自己显示的文字
  const label = metLabel(info.met);
  for (let i = 0; i < digits.length; i++) {
    const ch = label[i] ?? " ";
    if (digits[i].textContent !== ch) digits[i].textContent = ch;
  }

  // 事件旗：走过的升起
  flags.forEach((flag, index) => {
    const up = info.met >= D.events[index].met - 0.5;
    flag.setAttribute("transform", up ? translateAlong(P, [0, 0, RAISED]) : "");
  });

  // 深度重排：只有次序变了才动 DOM
  const delta = depthOf(rail, P) - depthOf(restRail, P);
  const order = moving.map((item) => ({ node: item.node, key: item.k + delta }));
  const sorted = [...order].sort((a, b) => a.key - b.key);
  let changed = false;
  for (let i = 0; i < sorted.length; i++) if (sorted[i].node !== order[i].node) { changed = true; break; }
  if (changed) {
    const fragment = document.createDocumentFragment();
    for (const item of sorted) fragment.appendChild(item.node);
    front.appendChild(fragment);
  }

  // 读数：相位名与数字取自同一个瞬间
  const text = `${metLabel(info.met)} · ${D.phases[info.index].zh} · 距地 ${group(info.rangeKm)} km · ${info.speedKmS.toFixed(2)} km/s`;
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuenow", String(Math.round(p * 1000)));
  return info;
}

const WATER = D.water;
const TANK = D.tank;
const FRAGMENT = `
uniform vec3 uNoz;
uniform float uNozR;
uniform float uGlow;
uniform float uReach;
uniform float uSplash;
uniform vec2 uSplashAt;
uniform float uLight;
const float WATER_Z = ${WATER.toFixed(1)};

vec3 paperOf(float e) {
  vec3 c = mix(vec3(1.0), vec3(0.99, 0.78, 0.42), smoothstep(0.0, 0.2, e));
  c = mix(c, vec3(1.0, 0.45, 0.10), smoothstep(0.15, 0.5, e));
  c = mix(c, vec3(0.84, 0.20, 0.05), smoothstep(0.42, 0.68, e));
  c = mix(c, vec3(1.0, 0.94, 0.80), smoothstep(0.66, 0.92, e));
  return c;
}

vec4 inkFor(vec3 seen, float cover) {
  vec3 absorbed = 1.0 - seen;
  float a = max(max(absorbed.r, max(absorbed.g, absorbed.b)), cover);
  return vec4(vec3(a) - absorbed, a);
}

vec4 paperOut(vec3 seen, float cover, float energy) {
  vec4 ink = inkFor(seen, cover);
  ink.rgb = min(ink.rgb, vec3(ink.a));
  float n = (hash12(gl_FragCoord.xy + fract(uTime * 0.61) * 91.0) + hash12(gl_FragCoord.yx * 1.37 + fract(uTime * 0.37) * 57.0) - 1.0) / 255.0;
  return max(ink + vec4(vec3(n), n) * smoothstep(0.0, 1.5 / 255.0, ink.a), 0.0);
}

vec4 darkOut(vec3 col) {
  col = tonemap(col, 1.2);
  float m = max(col.r, max(col.g, col.b));
  float n = (hash12(gl_FragCoord.xy + fract(uTime * 0.61) * 91.0) + hash12(gl_FragCoord.yx * 1.37 + fract(uTime * 0.37) * 57.0) - 1.0) / 255.0;
  col = max(col + n * smoothstep(0.0, 1.5 / 255.0, m), 0.0);
  m = max(col.r, max(col.g, col.b));
  return vec4(col, m);
}

void main() {
  vec2 vb = viewOf(gl_FragCoord.xy);
  vec3 V = towardViewer();
  vec3 p0 = rayOf(vb);
  float cE = uCam.w;
  float dith = hash12(gl_FragCoord.xy);
  float axis = 0.0, edge = 0.0, pale = 0.0;
  vec3 col = vec3(0.0);

  // I. 尾焰：从喷口向下的一段世界空间锥体
  if (uGlow > 0.002) {
    float ta = (uNoz.z - p0.z) / V.z;
    float tb = (uNoz.z - uReach - p0.z) / V.z;
    // 射线参数 t 越大越靠近观察者，而尾焰从喷口往 z 小的一侧延伸，
    // 所以从远端的 tb 往喷口的 ta 步进
    float dt = max(ta - tb, 0.0) / 22.0;
    for (int i = 0; i < 22; i++) {
      float t = tb + (float(i) + dith) * dt;
      vec3 q = p0 + t * V;
      float s = uNoz.z - q.z;
      float r = length(q.xy - uNoz.xy);
      float Rv = uNozR * (0.9 + 0.55 * s / max(uReach, 1.0));
      float rn = r / max(Rv, 1e-3);
      float near = smoothstep(-0.6, 1.6, s);
      float fade = 1.0 - smoothstep(uReach * 0.4, uReach, s);
      float w = dt * cE / max(Rv, 1e-3) * near * fade;
      axis += smoothstep(1.05, 0.35, rn) * w;
      edge += exp(-pow((rn - 0.9) / 0.24, 2.0)) * w;
      pale += exp(-rn * rn * 2.4) * w * (1.0 - smoothstep(uReach * 0.35, uReach * 0.95, s));
    }
    axis *= uGlow; edge *= uGlow; pale *= uGlow;
    if (uLight > 0.5) {
      float m = tonemap(vec3(axis * 0.8 + pale * 1.5), 1.2).r;
      vec3 seen = mix(paperOf(m), vec3(1.0, 0.88, 0.6), clamp(pale * 0.9, 0.0, 1.0));
      seen = mix(seen, vec3(0.86, 0.24, 0.06), clamp(edge * 0.8, 0.0, 1.0));
      gl_FragColor = paperOut(seen, 0.94 * smoothstep(0.42, 0.9, m), m);
      return;
    }
    col += vec3(1.0, 0.45, 0.11) * axis * 0.5;
    col += vec3(1.0, 0.84, 0.5) * pale * 1.2;
    col += vec3(1.0, 0.5, 0.14) * edge * 0.35;
  }

  // II. 溅落：水面上的扩散环与飞溅片，全部在世界空间
  if (uSplash > 0.002) {
    vec3 w = onFloor(vb, WATER_Z);
    float r = length(w.xy - uSplashAt);
    float inTank = 1.0 - smoothstep(${(Math.min(TANK.w, TANK.d) / 2 - 1).toFixed(1)}, ${(Math.min(TANK.w, TANK.d) / 2 + 2).toFixed(1)}, r);
    float ring = exp(-pow((r - 4.0 - 22.0 * uSplash) / 4.2, 2.0));
    float sheet = exp(-r / (9.0 + 26.0 * uSplash)) * inTank;
    float splash = uSplash * uSplash;
    if (uLight > 0.5) {
      float m = clamp(sheet * 0.7 + ring * 0.55, 0.0, 1.0) * splash;
      vec3 seen = mix(vec3(1.0), vec3(0.55, 0.72, 0.92), clamp(m * 1.4, 0.0, 1.0));
      vec4 ink = inkFor(seen, 0.0);
      gl_FragColor = paperOut(seen, 0.0, m) * m;
      return;
    }
    col += vec3(0.86, 0.93, 1.0) * sheet * 0.5 * splash;
    col += vec3(1.0, 0.96, 0.9) * ring * 0.45 * splash;
  }

  gl_FragColor = darkOut(col);
}
`;

const layer = canvas
  ? glLayer({
      canvas,
      fragment: FRAGMENT,
      view: [D.W, D.H],
      camera: D.camera,
      uniforms: ["uNoz", "uNozR", "uGlow", "uReach", "uSplash", "uSplashAt", "uLight"],
      onError(message) {
        window.__glError = message;
        console.error(message);
      },
    })
  : null;
if (layer) stage.setAttribute("data-gl", "");
window.__glDebug = { hasCanvas: Boolean(canvas), hasLayer: Boolean(layer), error: window.__glError ?? null };

/** 主题对应的着色分支：1 = 亮色（纸上的墨），0 = 暗色（自发光） */
let lightUniform = D.light ? 1 : 0;

const glow = { x: 0, v: 0 };
const splash = { x: 0, v: 0 };
let splashAt = 0;
let lastNozzle = null;

/** 尾焰与溅落状态：从同一个 p 取，不留第二份真值 */
function effects(info, dt, calm, snap) {
  const burn = burnAt(p);
  const nozzle = burn.engine === "off" ? null : D.engines[burn.engine];
  const want = nozzle ? burn.level : 0;
  const rail = railPoint(p);
  const world = nozzle
    ? [D.padX + (rail[0] - restRail[0]), D.plateY, nozzle.z + (rail[2] - restRail[2]) - hoistAt(p) * (burn.engine === "lmd" || burn.engine === "lma" ? D.hoist : 0)]
    : null;
  if (snap) {
    glow.x = want;
    glow.v = 0;
  } else {
    settle(glow, want, dt, 0.22, calm);
  }
  lastNozzle = world;

  // 溅落：p 越过 1 之前的一段出现，然后衰减
  const wantSplash = p > 0.995 ? 1 : 0;
  if (wantSplash && !splashAt) splashAt = 1e-6;
  if (snap) {
    splash.x = wantSplash ? 1 : 0;
    splash.v = 0;
  } else if (wantSplash) {
    splashAt += dt;
    settle(splash, 1, dt, 0.3, calm);
  } else {
    settle(splash, 0, dt, 0.5, calm);
  }
  return { level: glow.x, nozzle: world, nozzleR: nozzle ? nozzle.r : 1, splash: splash.x };
}

function paintEffects(state, calm, snap) {
  if (!layer) return;
  window.__glState = { level: state.level, splash: state.splash, nozzle: state.nozzle, r: state.nozzleR };
  const active = state.level > 0.004 || state.splash > 0.004;
  if (!active) {
    layer.clear();
    return;
  }
  const at = state.nozzle ?? lastNozzle ?? [0, 0, 0];
  layer.draw(
    {
      uNoz: at,
      uNozR: state.nozzleR,
      uGlow: state.level,
      uReach: Math.min(26 + 34 * state.level, Math.max(8, at[2] - 2)),
      uSplash: state.splash,
      uSplashAt: [D.tank.x + D.tank.w / 2, D.tank.y + D.tank.d / 2],
      uLight: lightUniform,
    },
    calm || snap ? 0.8 : clock,
  );
}

// ============================================================================
// IV. 主循环
// ============================================================================

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  clock += dt * speed;
  if (touring) target = tourAt(clock);
  p = calm ? target : p + (target - p) * (1 - Math.exp(-dt / 0.26));
  if (Math.abs(target - p) < 1e-4) p = target;
  const info = draw(dt, false);
  const state = effects(info, dt, calm, false);
  paintEffects(state, calm, false);
  if (holdFrames > 0) {
    holdFrames -= 1;
    paintEffects(state, calm, true);
  }
  const settled = !touring && p === target && !still.matches ? false : true;
  const separating = [...stageGroups.keys()].some((id) => (jettisonAt(p)[id] ?? 0) > 0 && (sepState.get(id) ?? 0) < 1);
  const busy = touring || p !== target || separating || glow.x > 0.004 || splash.x > 0.004 || holdFrames > 0;
  frame = visible && (busy || !settled) ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

const kick = () => {
  touring = false;
  clearTimeout(kick.timer);
  kick.timer = setTimeout(() => {
    touring = !still.matches;
    clock = 0;
    run();
  }, 3600);
  run();
};

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

// ============================================================================
// V. 交互
// ============================================================================

const NEAREST_EVENT = (value) => {
  let best = 0;
  for (let i = 0; i < D.events.length; i++) if (Math.abs(D.events[i].p - value) < Math.abs(D.events[best].p - value)) best = i;
  return best;
};

function steer(next) {
  target = clamp(next, 0, 1);
  kick();
}

stage.addEventListener("pointerdown", (event) => {
  if (still.matches) touring = false;
  stage.setPointerCapture(event.pointerId);
  stage.dataset.drag = "1";
  steer(target);
  event.preventDefault();
});

stage.addEventListener("pointermove", (event) => {
  if (stage.dataset.drag !== "1") return;
  const box = stage.getBoundingClientRect();
  steer((event.clientX - box.left) / box.width);
});

for (const type of ["pointerup", "pointercancel"]) {
  stage.addEventListener(type, (event) => {
    delete stage.dataset.drag;
    if (stage.hasPointerCapture?.(event.pointerId)) stage.releasePointerCapture(event.pointerId);
  });
}

stage.addEventListener("keydown", (event) => {
  const here = NEAREST_EVENT(target);
  let next = null;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") next = D.events[Math.min(D.events.length - 1, here + (event.shiftKey ? 3 : 1))].p;
  if (event.key === "ArrowLeft" || event.key === "ArrowUp") next = D.events[Math.max(0, here - (event.shiftKey ? 3 : 1))].p;
  if (event.key === "Home") next = 0;
  if (event.key === "End") next = 1;
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    touring = !touring && !still.matches;
    if (touring) clock = p * TOUR_SECONDS;
    else target = p;
    run();
    return;
  }
  if (next === null) return;
  event.preventDefault();
  steer(next);
});

stage.addEventListener("focus", () => {
  stage.setAttribute("aria-valuetext", `${D.events[NEAREST_EVENT(p)].zh} · ${metLabel(physicsAt(p).met)}`);
});

// ============================================================================
// VI. 操作入口
//
// I. 键盘能做的，页面上都要能点
//
// 1. 播放/暂停、进度滑杆、跳事件、速度、主题、回到发射
// 2. 主题切换只改 body 的 data-theme：两套调色板都在 ISO_CSS 里，
//    WebGL 那一层靠 uLight 跟着换，不是换一份页面
// 3. 滑杆与状态双向同步：拖动时写 p，巡游时读 p 回写
// ============================================================================

const SPEEDS = [1, 2, 4];
const bar = document.querySelector(".lms-controls");
const playButton = bar?.querySelector('[data-act="play"]');
const scrubInput = bar?.querySelector('[data-act="scrub"]');
const percentLabel = bar?.querySelector('[data-act="percent"]');
const jumpSelect = bar?.querySelector('[data-act="jump"]');
const speedButton = bar?.querySelector('[data-act="speed"]');
const themeButton = bar?.querySelector('[data-act="theme"]');
const resetButton = bar?.querySelector('[data-act="reset"]');
let speed = 1;
let themeName = document.body.dataset.theme === "light" ? "light" : "dark";

function setTheme(name) {
  themeName = name === "light" ? "light" : "dark";
  document.body.dataset.theme = themeName;
  if (themeButton) themeButton.textContent = themeName === "light" ? "暗色" : "亮色";
  // 画布层是同一套相机，但亮色要换"纸上的墨"配方，靠 uniform 切分支
  lightUniform = themeName === "light" ? 1 : 0;
  holdFrames = 4;
  run();
}

function setPlaying(next) {
  touring = next && !still.matches;
  if (touring) clock = p * TOUR_SECONDS;
  else target = p;
  if (playButton) {
    playButton.textContent = touring ? "暂停" : "播放";
    playButton.setAttribute("aria-pressed", touring ? "true" : "false");
  }
  run();
}

playButton?.addEventListener("click", () => setPlaying(!touring));

scrubInput?.addEventListener("input", () => {
  setPlaying(false);
  steer(Number(scrubInput.value) / 1000);
});

jumpSelect?.addEventListener("change", () => {
  const index = Number(jumpSelect.value);
  setPlaying(false);
  steer(D.events[index]?.p ?? 0);
  stage.focus({ preventScroll: true });
});

speedButton?.addEventListener("click", () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  speedButton.textContent = `${speed}×`;
});

themeButton?.addEventListener("click", () => setTheme(themeName === "light" ? "dark" : "light"));

resetButton?.addEventListener("click", () => {
  setPlaying(false);
  steer(0);
});

/** 滑杆与百分比只在数值真的变了时回写，避免每帧碰 DOM */
let shown = -1;
function syncBar(value) {
  const step = Math.round(value * 1000);
  if (step === shown) return;
  shown = step;
  if (scrubInput && document.activeElement !== scrubInput) scrubInput.value = String(step);
  if (percentLabel) percentLabel.textContent = `${Math.round(value * 100)}%`;
  if (jumpSelect) {
    const near = NEAREST_EVENT(value);
    if (jumpSelect.value !== String(near)) jumpSelect.value = String(near);
  }
  if (playButton && !touring && playButton.textContent !== "播放") {
    playButton.textContent = "播放";
    playButton.setAttribute("aria-pressed", "false");
  }
}

// ============================================================================
// VII. 录制钩子
// ============================================================================

window.__lunar = {
  ready: true,
  still: false,
  /** 逐帧设置任务进度；settle 为真时所有缓动值直接跳到目标 */
  set(next, opts = {}) {
    touring = false;
    clearTimeout(kick.timer);
    p = clamp(next, 0, 1);
    target = p;
    clock = 0;
    const info = draw(0, true);
    const state = effects(info, 0, true, true);
    paintEffects(state, true, true);
    if (opts.settle !== false) {
      // 录制时保持尾焰画面，避免两次 rAF 后画布被清空
      holdFrames = 4;
      run();
    }
  },
  play() {
    touring = true;
    clock = p * TOUR_SECONDS;
    run();
  },
  pause() {
    touring = false;
    target = p;
    run();
  },
  progress() {
    return p;
  },
};

if (still.matches) touring = false;
draw(0, true);
paintEffects(effects(physicsAt(p), 0, true, true), true, true);
</script></body></html>
